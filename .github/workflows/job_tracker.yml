name: Job Listing Tracker

# PAUSED: the daily schedule is switched off and the tracker is disconnected
# from the Google Sheet. A manual run from the Actions tab only prints a
# "paused" message and exits.
#
# To resume, restore the schedule below and the credentials/SHEET_ID steps:
#   schedule:
#     - cron: "0 8 * * *"
on:
  workflow_dispatch:

jobs:
  check-listings:
    name: Check job listing availability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Alerts go to the single address stored in the ALERT_EMAIL secret.
      # No Google credentials or SHEET_ID are written while the sheet is
      # disconnected.
      - name: Write config file
        run: |
          cat > config.py << 'EOF'
          GMAIL_ADDRESS        = "${{ secrets.GMAIL_ADDRESS }}"
          GMAIL_APP_PASSWORD   = "${{ secrets.GMAIL_APP_PASSWORD }}"
          ALERT_EMAIL          = "${{ secrets.ALERT_EMAIL }}"
          EOF

      - name: Run job tracker
        run: python job_tracker.py
